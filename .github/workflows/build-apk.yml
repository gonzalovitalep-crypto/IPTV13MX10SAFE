name: Compilar APK Chile TV IPTV MX10 SAFE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v6

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Compilar APK SAFE
        working-directory: ChileTV_IPTV_Android_TV13_repo/ChileTV_IPTV_Android
        run: gradle assembleDebug --stacktrace

      - name: Comprobar APK generado
        run: ls -lh ChileTV_IPTV_Android_TV13_repo/ChileTV_IPTV_Android/app/build/outputs/apk/debug/

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: ChileTV-IPTV-MX10-SAFE-v4
          path: ChileTV_IPTV_Android_TV13_repo/ChileTV_IPTV_Android/app/build/outputs/apk/debug/app-debug.apk
