plugins {
    id 'com.android.application'
}

android {
    namespace 'cl.chiletv.app'
    compileSdk 35

    defaultConfig {
        applicationId 'cl.chiletv.app.safe'
        minSdk 21
        targetSdk 25
        versionCode 9
        versionName '1.6.0-mx10-memory-player'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Intencionalmente vacío: esta edición SAFE usa solo APIs nativas de Android.
}
